name: Background Worker
on:
  schedule:
    # Запускаем каждые 10 минут
    - cron: '*/10 * * * *'
  
  # Позволяет запускать вручную
  workflow_dispatch:

jobs:
  run-worker:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Забираем код
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 2. Настраиваем Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      # 3. Запускаем скрипт
      - name: Run worker script
        run: |
          echo "🚀 Фоновый работник запущен!"
          echo "Время: $(date)"
          echo "GitHub Actions работает бесплатно! 🎉"
          # Пока просто тестовый вывод
